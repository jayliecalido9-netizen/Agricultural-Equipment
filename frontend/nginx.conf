upstream aeams_api {
  zone aeams_api 64k;
  resolver 127.0.0.11 valid=5s ipv6=off;
  server backend:5000 resolve;
}
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 6m;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location = /healthz {
    access_log off;
    proxy_pass http://aeams_api/api/v1/health;
  }
  location /api/ {
    # API responses supply their own Helmet policy, including Swagger's script policy.
    add_header X-Content-Type-Options nosniff always;
    proxy_pass http://aeams_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_buffering off;
  }
  location /api-docs {
    add_header X-Content-Type-Options nosniff always;
    proxy_pass http://aeams_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /assets/ { expires 1y; try_files $uri =404; }
  location / { expires -1; try_files $uri $uri/ /index.html; }
}
